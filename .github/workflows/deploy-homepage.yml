# Deploy the Hansei by Design landing page (this branch) to hanseibydesign.com
# Static site — no build step; uploads site/ into public_html (the FTP
# account's root). Reuses the same FTP secrets as the spends deploy on main.

name: Deploy homepage

on:
  push:
    branches: [homepage]
  workflow_dispatch:

env:
  FTP_SERVER: 46.28.45.60
  FTP_SERVER_DIR: ./

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          local-dir: ./site/
          state-name: .ftp-deploy-homepage-state.json
