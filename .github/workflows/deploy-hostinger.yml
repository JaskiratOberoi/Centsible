# Deploy Centsible to Hostinger (spends.hanseibydesign.com) via FTP
# Builds the Vite app and uploads dist/ into the subdomain's document root

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FTP_SERVER: 46.28.45.60
  # FTP root is usually public_html — "spends" lands files in public_html/spends,
  # the document root of spends.hanseibydesign.com
  FTP_SERVER_DIR: spends

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.FTP_SERVER_DIR }}/
          local-dir: ./dist/
